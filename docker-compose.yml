name: kennemer
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        KENNEMER_BUILD_COMMIT: ${KENNEMER_BUILD_COMMIT:-}
    image: kennemer:prod
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:80/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    environment:
      NODE_ENV: production
      PORT: "80"
      HOST: "0.0.0.0"
      KENNEMER_MAINTENANCE_URL: http://host.docker.internal:8787
      DEVICE_STATE_PATH: /data/device-states.json
      IP_CACHE_PATH: /runtime/ips.json
      SCENE_OVERRIDE_PATH: /runtime/scene-overrides.json
      KENNEMER_TIMED_TRIGGER_PATH: /data/timed-triggers.json
      KENNEMER_AUDIT_LOG_DIR: /data/logs
      KENNEMER_AUDIT_TIME_ZONE: Europe/Amsterdam
      HTTPS_PORT: "443" # optional: remove or change if you don't need TLS
      HTTPS_KEY_PATH: /certs/server.key
      HTTPS_CERT_PATH: /certs/server.crt
      # HTTPS_CA_PATH: /certs/ca.pem
      # HTTPS_PASSPHRASE: example-passphrase
    ports:
      - "80:80"
      - "443:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    working_dir: /app
    env_file:
      - ./app/.env
    volumes:
      - kennemer-state:/data
      - /opt/kennemer/runtime:/runtime
    # volumes: # uncomment to mount your own TLS certs over the baked-in self-signed ones
    #   - ./certs/server.key:/certs/server.key:ro
    #   - ./certs/server.crt:/certs/server.crt:ro
    #   - ./certs/ca.pem:/certs/ca.pem:ro

volumes:
  kennemer-state:
