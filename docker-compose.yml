name: kennemer
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: kennemer:prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "80"
      HOST: "0.0.0.0"
    ports:
      - "127.0.0.1:80:80"
    working_dir: /app
    env_file:
      - ./app/.env
